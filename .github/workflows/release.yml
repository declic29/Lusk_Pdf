# Lusk PDF (repris de Lusk Texte, Lusk Tab et Lusk Diapo) : la chaîne de publication de
# l'association Lusk.
#
# Pour publier une version :
#   1. Augmenter `version` dans [workspace.package] du Cargo.toml racine (par exemple 1.0.1),
#      lancer `cargo check` pour mettre Cargo.lock à jour, committer et pousser.
#   2. Créer et pousser l'étiquette correspondante :
#        git tag v1.0.1
#        git push origin v1.0.1
#   3. Ce workflow fabrique les installeurs Windows, macOS et Linux, calcule SHA256SUMS.txt et
#      prépare une Release en brouillon sur GitHub.
#   4. Tester les installeurs du brouillon, puis cliquer sur « Publish release » : à partir de là,
#      Aide › Rechercher des mises à jour… de Lusk PDF la propose aux utilisateurs.
#
# « Run workflow » (onglet Actions) fait la même chose sans étiquette, pour un essai : le brouillon
# n'est visible que des membres du dépôt tant qu'il n'est pas publié.
#
# Ce workflow ne passe pas par les workflows partagés de storytold (craft-common-actions) : leur
# publication exige une machine macOS payante (macos-15-xlarge) et des certificats, et elle s'est
# arrêtée le 20 novembre 2026 sur Linux (rust-channel demande Python 3.11). Ici, tout tient dans ce
# fichier, sur des machines gratuites pour un dépôt public.
#
# Les noms des fichiers (Lusk-Pdf-<version>-windows-x64.msi, -macos-universal.dmg,
# -linux-x86_64.AppImage…) sont ceux que le module de mise à jour cherche : ne pas les changer
# sans changer aussi UPDATE_APP dans crates/ui-egui/src/lib.rs (le test
# the_updater_reads_the_names_of_the_lusk_pdf_packages les vérifie).
#
# Signature : sans les secrets ci-dessous, les installeurs sont fabriqués sans signature (Windows
# affiche « éditeur inconnu », macOS demande un clic droit › Ouvrir). Avec eux, ils sont signés :
#   Windows : WINDOWS_CERTIFICATE (PFX en base64) et WINDOWS_CERTIFICATE_PASSWORD
#   macOS   : APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, KEYCHAIN_PASSWORD (signature) et
#             APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID (notarisation)
name: Publication

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Les polices libres intégrées à l'application (storytold/craft-fonts), à ce commit précis.
  CRAFT_FONTS_REF: b076417b5880bd4154bd22f00695b1d28c6bea83
  # Les traductions sont dans le dépôt (i18n/locales) : pas de craft-i18n à récupérer.

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      date: ${{ steps.v.outputs.date }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: v
        name: Lire la version du Cargo.toml
        shell: bash
        run: |
          version=$(awk '/^\[/ { p = ($0 == "[workspace.package]"); next } p && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }' Cargo.toml)
          if [ -z "$version" ]; then echo "::error::version introuvable dans [workspace.package] du Cargo.toml"; exit 1; fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::l'étiquette $GITHUB_REF_NAME ne correspond pas à la version du Cargo.toml ($version) : l'étiquette doit être v$version"
            exit 1
          fi
          {
            echo "version=$version"
            echo "date=$(date -u +%Y-%m-%d)"
          } >>"$GITHUB_OUTPUT"
          echo "Lusk PDF $version"

  windows:
    name: Windows x64
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PDFCRAFT_VERSION: ${{ needs.version.outputs.version }}
      PDFCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      PDFCRAFT_BUILD_SHA: ${{ github.sha }}
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      CRAFT_FONTS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: publication-windows-x64
      - name: Installer WiX 5
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed.' }
      - name: Compiler, signer et empaqueter (MSI et zip portable)
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./packaging/windows/package.ps1 -Arch x64
      - uses: actions/upload-artifact@v7
        with:
          name: publication-windows-x64
          path: dist/release/*
          if-no-files-found: error

  macos:
    name: macOS universel
    needs: version
    runs-on: macos-15
    timeout-minutes: 120
    env:
      PDFCRAFT_VERSION: ${{ needs.version.outputs.version }}
      PDFCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      PDFCRAFT_BUILD_SHA: ${{ github.sha }}
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      CRAFT_FONTS_REQUIRED: "1"
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: publication-macos-universal
      - name: Importer le certificat de signature
        if: env.HAS_APPLE_CERTIFICATE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: packaging/macos/import-cert.sh
      - name: Compiler, signer et empaqueter (DMG)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/macos/package.sh --arch universal
      - uses: actions/upload-artifact@v7
        with:
          name: publication-macos
          path: dist/release/*
          if-no-files-found: error
      - name: Supprimer le trousseau temporaire
        if: always()
        run: |
          if [ -n "${MACOS_KEYCHAIN:-}" ]; then security delete-keychain "$MACOS_KEYCHAIN" || true; fi

  linux:
    name: Linux x86_64
    needs: version
    # Ubuntu 22.04 : les binaires fonctionnent aussi sur les distributions plus récentes.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      PDFCRAFT_VERSION: ${{ needs.version.outputs.version }}
      PDFCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      PDFCRAFT_BUILD_SHA: ${{ github.sha }}
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      CRAFT_FONTS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
          persist-credentials: false
      - name: Installer les outils de compilation et d'empaquetage
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libasound2-dev pkg-config desktop-file-utils appstream python3-yaml zsync libfuse2
          curl --proto '=https' -fsSL -o "$RUNNER_TEMP/nfpm.deb" \
            https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_amd64.deb
          echo "787af76e172dd5fc7cedf4d7c5a090a2f62be9001557a4db1103e270f90ddefd  $RUNNER_TEMP/nfpm.deb" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/nfpm.deb"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: publication-linux-x86_64
      - name: Compiler et empaqueter (AppImage, deb, rpm, tar.gz)
        run: packaging/linux/package.sh
      - name: Vérifier les paquets
        run: |
          dpkg-deb --info dist/release/*.deb
          for appimage in dist/release/*.AppImage; do
            chmod +x "$appimage"
            APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --version || true
          done
      - uses: actions/upload-artifact@v7
        with:
          name: publication-linux-x86_64
          path: dist/release/*
          if-no-files-found: error

  release:
    name: Release en brouillon
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: publication-*
          path: dist
          merge-multiple: true
      - name: Copies aux noms stables, pour les liens « dernière version » du README et du site
        working-directory: dist
        # https://github.com/<dépôt>/releases/latest/download/Lusk-Pdf-Windows.msi télécharge
        # toujours la dernière version. Le module de mise à jour ignore ces copies (il cherche
        # les noms Lusk-Pdf-<version>-…).
        run: |
          cp "Lusk-Pdf-$VERSION-windows-x64.msi" Lusk-Pdf-Windows.msi
          cp "Lusk-Pdf-$VERSION-macos-universal.dmg" Lusk-Pdf-Mac.dmg
          cp "Lusk-Pdf-$VERSION-linux-x86_64.AppImage" Lusk-Pdf-Linux.AppImage
          for deb in Lusk-Pdf-"$VERSION"*.deb; do cp "$deb" Lusk-Pdf-Linux.deb; done
      - name: Calculer les empreintes (SHA256SUMS.txt)
        working-directory: dist
        run: |
          rm -f SHA256SUMS.txt
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Créer ou compléter la Release en brouillon
        run: |
          tag="v$VERSION"
          {
            echo "Lusk PDF $VERSION, publié par l'association Lusk."
            echo
            echo "Téléchargez le fichier de votre système :"
            echo "- Windows : Lusk-Pdf-Windows.msi"
            echo "- macOS : Lusk-Pdf-Mac.dmg (première ouverture : clic droit › Ouvrir)"
            echo "- Linux : Lusk-Pdf-Linux.AppImage, ou Lusk-Pdf-Linux.deb (Debian, Ubuntu, Mint)"
            echo
            echo "Les fichiers Lusk-Pdf-$VERSION-… sont les mêmes, avec leur numéro de version (et aussi le .rpm, le .tar.gz et la version portable pour Windows)."
            echo
            echo "Les personnes qui ont déjà Lusk PDF reçoivent cette version par Aide › Rechercher des mises à jour…"
          } >"$RUNNER_TEMP/notes.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            # La Release existe déjà (un essai précédent) : on retire les fichiers que cette
            # fabrication ne produit plus.
            gh release view "$tag" --json assets --jq '.assets[].name' | while IFS= read -r old; do
              if [ ! -e "dist/$old" ]; then
                echo "Retiré de la Release : $old"
                gh release delete-asset "$tag" "$old" --yes
              fi
            done
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --draft --target "$GITHUB_SHA" \
              --title "Lusk PDF $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          echo "Brouillon prêt : https://github.com/$GH_REPO/releases"
